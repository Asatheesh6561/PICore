defaults:
  - dataset: Burgers
  - model: FNO
  - _self_
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  

device: ${oc.env:DEVICE,"cuda"}
subset_percentage: 20.0
log_dir: ./results
coreset_algorithm: craig
seed: 10
grad_clip: 5.0
overwrite: true
attack: ""
eqn_weight: 0.01
ic_weight: 0.99
nrmse_weight: 0.0
pretrain_epochs: 25
epochs: 500
lr: 1e-3
wandb: true
wandb_project: DENO
wandb_entity: "DENO"
wandb_dir: ./wandb
mask_percentage: 0.2
blur_std: 0.3
simclr_epochs: 100
sample_size_fraction: 0.1
# pretrain_model_save_path: ${log_dir}/models
